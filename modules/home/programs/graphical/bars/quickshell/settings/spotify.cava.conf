# Minimal cava profile for the island visualizer (optional: SPOTIFY_CAVA=1).
[general]
framerate = 12
bars = 5
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
monstercat = 0

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
