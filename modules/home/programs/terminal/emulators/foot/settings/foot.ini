# Foot Configuration (Migrated from Kitty)
include=~/.config/foot/theme

[main]
font=JetBrainsMono Nerd Font:size=12
pad=10x10 center
# Force a terminfo that exists on NixOS (session may export xterm-kitty from kitty)
term=xterm-256color

[text-bindings]
# Word navigation (emacs-style — zsh/readline default bindings)
\x1bb=Control+Left
\x1bf=Control+Right
\x1bB=Control+Shift+Left
\x1bF=Control+Shift+Right

# Word delete
\x17=Control+BackSpace
\x1bd=Control+Delete

[colors-dark]
alpha=0.7
